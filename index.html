<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A little something for your new beginning</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="bouquet-page">

        <div class="bouquet">

            <!-- FOLIAGE BACK -->
            <img src="assets/eucalyptus1.png" class="flower eucalyptus e1">
            <img src="assets/eucalyptus2.png" class="flower eucalyptus e2">

            <img src="assets/olive-branch1.png" class="flower olive o1">
            <img src="assets/olive-branch2.png" class="flower olive o2">

            <!-- BABY'S BREATH -->
            <img src="assets/baby-breath1.png" class="flower baby b1">
            <img src="assets/baby-breath2.png" class="flower baby b2">

            <!-- SMALL FLOWERS -->
            <img src="assets/small-flower1.png" class="flower small sf1">
            <img src="assets/small-flower2.png" class="flower small sf2">

            <!-- MAIN FLOWERS -->
            <img src="assets/rose1.png" class="flower rose r1">
            <img src="assets/rose2.png" class="flower rose r2">

            <img src="assets/carnation1.png" class="flower carnation c1">
            <img src="assets/carnation2.png" class="flower carnation c2">

            <!-- TULIPS -->
            <img src="assets/tulip1.png" class="flower tulip t1">
            <img src="assets/tulip2.png" class="flower tulip t2">
            <img src="assets/tulip3.png" class="flower tulip t3">

            <!-- SUNFLOWER -->
            <img src="assets/sunflower.png" class="flower sunflower">

            <!-- WRAPPING -->
            <div class="wrapping">
                <div class="wrap-left"></div>
                <div class="wrap-right"></div>
                <div class="wrap-center"></div>
            </div>

            <!-- RIBBON -->
            <img src="assets/ribbon.png" class="ribbon">

        </div>

        <div class="message">
            <p class="eyebrow">a little something for you</p>

            <h1>
                Here's to your<br>
                <span>new beginning.</span>
            </h1>

            <p class="subtitle">
                May this new chapter bring you<br>
                beautiful things, little victories,<br>
                and everything you've been praying for.
            </p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
